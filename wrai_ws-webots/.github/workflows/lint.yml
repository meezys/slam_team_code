name: lint

on: [push]

jobs:
  flake8:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8"]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"
        cache-dependency-path: 'lint_requirements.txt'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r lint_requirements.txt
    - name: Analysing the code with flake8
      run: |
        flake8 $(git ls-files '*.py' | grep -Ev "(wrai_perception/deploy|wrai_perception/detect.py|wrai_perception/export.py|wrai_perception/hubconf.py|wrai_perception/models|wrai_perception/test.py|wrai_perception/train.py|wrai_perception/train_aux.py|wrai_perception/utils)")
  
  pydocstyle:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8"]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"
        cache-dependency-path: 'lint_requirements.txt'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r lint_requirements.txt
        
    - name: Analysing the code with pydocstyle
      run: pydocstyle $(git ls-files '*.py' | grep -Ev "(test|docs|launch|setup|wrai_perception/deploy|wrai_perception/detect.py|wrai_perception/export.py|wrai_perception/hubconf.py|wrai_perception/models|wrai_perception/test.py|wrai_perception/train.py|wrai_perception/train_aux.py|wrai_perception/utils)")
